openapi: 3.1.0

info:
  title: restgo API
  version: 1.0.0
  summary: A small REST API with JWT authentication.
  description: |
    Authentication uses two HS256 JWTs.

    - The **access token** is short-lived (15 minutes by default) and is sent as
      `Authorization: Bearer <token>` on every protected call.
    - The **refresh token** is long-lived (7 days by default) and is only
      accepted by `POST /api/v1/auth/refresh`.

    Each token carries a `kind` claim, and every endpoint rejects the wrong
    kind. A refresh token cannot be used as a bearer token on a protected
    route, and an access token cannot be exchanged at the refresh endpoint.

    To try a protected endpoint here: call `/api/v1/auth/register` or
    `/api/v1/auth/login`, copy `tokens.access_token` from the response, then
    press **Authorize** above and paste it.
  license:
    name: MIT

servers:
  - url: /
    description: The server serving this document

tags:
  - name: health
    description: Liveness probing.
  - name: auth
    description: Registration, login, and token refresh.
  - name: users
    description: Reading user records. Requires a valid access token.

# Endpoints are public unless they declare their own `security`.
security: []

paths:
  /healthz:
    get:
      tags: [health]
      summary: Liveness probe
      description: Always returns 200 while the process is able to serve traffic.
      operationId: getHealth
      responses:
        "200":
          description: The server is up.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [status]
                properties:
                  status:
                    type: string
                    const: ok
              example:
                status: ok

  /api/v1/auth/register:
    post:
      tags: [auth]
      summary: Create an account
      description: |
        Registers a user and immediately returns a token pair, so a client does
        not have to call `/auth/login` straight after signing up.

        Emails are stored case-insensitively and must be unique. Passwords are
        hashed with bcrypt and are never returned by any endpoint.
      operationId: register
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
            example:
              email: ada@example.com
              name: Ada Lovelace
              password: sup3rsecret
      responses:
        "201":
          description: The account was created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          description: That email is already registered.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: email already registered
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/auth/login:
    post:
      tags: [auth]
      summary: Exchange credentials for tokens
      description: |
        A wrong password and an unregistered email return the identical 401
        response, so this endpoint cannot be used to discover which addresses
        have accounts.
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
            example:
              email: ada@example.com
              password: sup3rsecret
      responses:
        "200":
          description: The credentials were accepted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          description: The email or password was wrong.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: invalid email or password
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/auth/refresh:
    post:
      tags: [auth]
      summary: Trade a refresh token for a new pair
      description: |
        Returns a brand new access and refresh token. The user is re-read from
        storage first, so a deleted account cannot keep minting tokens.

        Refresh tokens are currently stateless: presenting the old one again
        before it expires still works. See the README for what revocation would
        require.
      operationId: refresh
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRequest"
      responses:
        "200":
          description: A new token pair.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenPair"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          description: |
            The token was missing, malformed, expired, signed by another key,
            an access token rather than a refresh token, or belonged to an
            account that no longer exists.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: invalid or expired refresh token
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/me:
    get:
      tags: [users]
      summary: The caller's own profile
      description: Resolves the `sub` claim of the access token to a user record.
      operationId: getMe
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The authenticated user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/users:
    get:
      tags: [users]
      summary: List users
      description: |
        Returns every user, newest first.

        There is no role model yet, so any authenticated user can call this.
      operationId: listUsers
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The full list of users.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data, count]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/User"
                  count:
                    type: integer
                    description: The number of records in `data`.
                    examples: [1]
        "401":
          $ref: "#/components/responses/Unauthorized"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Paste the `access_token` returned by register, login, or refresh.

  schemas:
    User:
      type: object
      description: A user account. The password hash is never serialised.
      additionalProperties: false
      required: [id, email, name, created_at]
      properties:
        id:
          type: string
          description: A random 128-bit identifier, hex encoded.
          examples: ["60de553dda103e556c3dcac40d1fd42a"]
        email:
          type: string
          format: email
          examples: ["ada@example.com"]
        name:
          type: string
          maxLength: 100
          examples: ["Ada Lovelace"]
        created_at:
          type: string
          format: date-time
          description: When the account was created, in UTC.
          examples: ["2026-10-05T02:12:27.284422Z"]

    RegisterRequest:
      type: object
      description: Unknown properties are rejected with a 400.
      additionalProperties: false
      required: [email, name, password]
      properties:
        email:
          type: string
          format: email
          description: Must parse as an address. Compared case-insensitively.
        name:
          type: string
          minLength: 1
          maxLength: 100
        password:
          type: string
          format: password
          minLength: 8
          maxLength: 72
          description: The upper bound is bcrypt's, which silently truncates beyond 72 bytes.

    LoginRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password

    RefreshRequest:
      type: object
      additionalProperties: false
      required: [refresh_token]
      properties:
        refresh_token:
          type: string
          description: The `refresh_token` from a previous register, login, or refresh.

    TokenPair:
      type: object
      additionalProperties: false
      required: [access_token, refresh_token, token_type, expires_in, refresh_expires_in]
      properties:
        access_token:
          type: string
          description: Send as `Authorization: Bearer <access_token>`.
        refresh_token:
          type: string
          description: Only accepted by `POST /api/v1/auth/refresh`.
        token_type:
          type: string
          const: Bearer
        expires_in:
          type: integer
          description: Access token lifetime in seconds.
          examples: [900]
        refresh_expires_in:
          type: integer
          description: Refresh token lifetime in seconds.
          examples: [604800]

    AuthResponse:
      type: object
      additionalProperties: false
      required: [user, tokens]
      properties:
        user:
          $ref: "#/components/schemas/User"
        tokens:
          $ref: "#/components/schemas/TokenPair"

    Error:
      type: object
      description: The envelope used by every non-2xx response.
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: string
          description: A human-readable message. Safe to show to a user.
        details:
          type: object
          description: Per-field problems. Only present on a 422.
          additionalProperties:
            type: string

  responses:
    BadRequest:
      description: |
        The body was not a single well-formed JSON object, contained a property
        the endpoint does not accept, or exceeded 1 MiB.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error: 'malformed JSON body: json: unknown field "role"'

    Unauthorized:
      description: |
        The `Authorization` header was missing, malformed, or carried a token
        that was expired, tampered with, or not an access token. The response
        includes a `WWW-Authenticate` header.
      headers:
        WWW-Authenticate:
          description: The challenge, per RFC 6750.
          schema:
            type: string
            examples: ['Bearer realm="restgo", error="invalid_token"']
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error: invalid or expired access token

    ValidationFailed:
      description: The body parsed, but one or more fields failed validation.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error: validation failed
            details:
              email: must be a valid email address
              name: is required
              password: must be at least 8 characters

    InternalError:
      description: Something failed server-side. The cause is logged, never returned.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error: internal server error
